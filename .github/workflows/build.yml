name: Image bauen

on:
  schedule:
    - cron: "17 4 * * *"   # täglich: neue LightCraft-Version?
  workflow_dispatch:         # manuell über "Run workflow"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - root/**
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version bestimmen
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(gh api repos/storytold/lightcraft/releases/latest --jq .tag_name | sed 's/^v//')"
          test -n "$VERSION"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "LightCraft $VERSION ist schon gebaut."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Baue LightCraft $VERSION."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.build == 'true'

      - name: Bauen und veröffentlichen
        if: steps.v.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          build-args: |
            LIGHTCRAFT_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:latest
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=LightCraft für Unraid
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            lightcraft.version=${{ steps.v.outputs.version }}
